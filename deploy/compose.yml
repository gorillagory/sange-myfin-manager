name: ${MYFIN_COMPOSE_PROJECT:-myfin-dev}
services:
  web:
    image: ${MYFIN_WEB_IMAGE:-myfin-web:phase02}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${MYFIN_WEB_BIND_IP:?assign runtime LAN bind IP}:${MYFIN_WEB_PORT:?assign verified unused web port}:8080"
    networks: [ingress, app]
    mem_limit: ${MYFIN_WEB_MEMORY:-128m}
    cpus: ${MYFIN_WEB_CPUS:-0.25}
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  api:
    image: ${MYFIN_API_IMAGE:-myfin-api:phase02}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      PGHOST: nexus-shared-postgres
      PGPORT: '5432'
      PGDATABASE: ${MYFIN_DB_NAME:-myfin_dev}
      PGUSER: ${MYFIN_DB_USER:-myfin_dev_runtime}
      PGPASSWORD_FILE: /run/secrets/db_password
      AUTH_BASE_URL: ${AUTH_BASE_URL:?set exact external HTTPS origin}
      AUTH_ALLOWED_HOSTS: ${AUTH_ALLOWED_HOSTS:?set reviewed host allowlist}
      AUTH_CONTROL_HOSTS: ${AUTH_CONTROL_HOSTS:-}
      PUBLIC_ROOT_DOMAIN: ${PUBLIC_ROOT_DOMAIN:-}
      # up.sh/production-up.sh derive the exact current web-container address.
      # Empty is safe: public requests then share the direct proxy rate bucket.
      PUBLIC_PROXY_ADDRESSES: ${PUBLIC_PROXY_ADDRESSES:-}
      TENANT_HOST_ENFORCEMENT: ${TENANT_HOST_ENFORCEMENT:-true}
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      POS_CODE_SECRET_FILE: /run/secrets/pos_code_secret
      POS_SESSION_SECRET_FILE: /run/secrets/pos_session_secret
      VOUCHER_HMAC_SECRET_FILE: /run/secrets/voucher_hmac_secret
      RECEIPT_EMAIL_ENABLED: ${RECEIPT_EMAIL_ENABLED:-false}
      PG_TLS: disable
      PGPOOL_MAX: ${MYFIN_DB_POOL_MAX:-5}
      PG_CONNECT_TIMEOUT_MS: '2000'
      PG_STATEMENT_TIMEOUT_MS: '3000'
      PG_QUERY_TIMEOUT_MS: '4000'
      SHUTDOWN_TIMEOUT_MS: '10000'
      UPLOAD_DIR: /app/uploads
    secrets: [db_password, auth_secret, pos_code_secret, pos_session_secret, voucher_hmac_secret]
    volumes:
      - uploads:/app/uploads
    networks: [app, nexus-data]
    mem_limit: ${MYFIN_API_MEMORY:-512m}
    cpus: ${MYFIN_API_CPUS:-1.0}
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health/ready',{signal:AbortSignal.timeout(7000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
  report-worker:
    image: ${MYFIN_API_IMAGE:-myfin-api:phase02}
    restart: unless-stopped
    init: true
    command: [node, src/report-worker.js]
    environment:
      NODE_ENV: production
      PGHOST: nexus-shared-postgres
      PGPORT: '5432'
      PGDATABASE: ${MYFIN_DB_NAME:-myfin_dev}
      PGUSER: ${MYFIN_DB_USER:-myfin_dev_runtime}
      PGPASSWORD_FILE: /run/secrets/db_password
      PG_TLS: disable
      PGPOOL_MAX: ${MYFIN_REPORT_DB_POOL_MAX:-2}
      PG_CONNECT_TIMEOUT_MS: '2000'
      PG_STATEMENT_TIMEOUT_MS: ${MYFIN_REPORT_STATEMENT_TIMEOUT_MS:-15000}
      PG_QUERY_TIMEOUT_MS: ${MYFIN_REPORT_QUERY_TIMEOUT_MS:-20000}
      # Runtime appends a per-process UUID; this value is only a readable replica label.
      REPORT_WORKER_ID: ${MYFIN_COMPOSE_PROJECT:-myfin-dev}-report-worker-1
      REPORT_WORKER_POLL_MS: ${MYFIN_REPORT_POLL_MS:-30000}
      CUSTOMER_ORDER_MAINTENANCE_BATCH_LIMIT: ${MYFIN_CUSTOMER_ORDER_MAINTENANCE_BATCH_LIMIT:-100}
    secrets: [db_password]
    networks: [nexus-data]
    mem_limit: ${MYFIN_REPORT_MEMORY:-256m}
    cpus: ${MYFIN_REPORT_CPUS:-0.5}
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
  receipt-email-worker:
    profiles: [receipt-email]
    image: ${MYFIN_API_IMAGE:-myfin-api:phase02}
    restart: unless-stopped
    init: true
    command: [node, src/receipt-email-worker.js]
    environment:
      NODE_ENV: production
      PGHOST: nexus-shared-postgres
      PGPORT: '5432'
      PGDATABASE: ${MYFIN_DB_NAME:-myfin_dev}
      PGUSER: ${MYFIN_DB_USER:-myfin_dev_runtime}
      PGPASSWORD_FILE: /run/secrets/db_password
      PG_TLS: disable
      PGPOOL_MAX: ${MYFIN_RECEIPT_EMAIL_DB_POOL_MAX:-2}
      PG_CONNECT_TIMEOUT_MS: '2000'
      PG_STATEMENT_TIMEOUT_MS: '5000'
      PG_QUERY_TIMEOUT_MS: '7000'
      RECEIPT_EMAIL_ENABLED: ${RECEIPT_EMAIL_ENABLED:-false}
      RECEIPT_EMAIL_WORKER_ID: ${MYFIN_COMPOSE_PROJECT:-myfin-dev}-receipt-email-worker-1
      RECEIPT_EMAIL_WORKER_POLL_MS: ${RECEIPT_EMAIL_WORKER_POLL_MS:-2000}
      # Connect to the reviewed address directly; validate TLS against the
      # separate certificate name so split/legacy DNS cannot redirect SMTP.
      RECEIPT_SMTP_ADDRESS: ${RECEIPT_SMTP_ADDRESS:-}
      RECEIPT_SMTP_PORT: ${RECEIPT_SMTP_PORT:-587}
      RECEIPT_SMTP_USERNAME: ${RECEIPT_SMTP_USERNAME:-}
      RECEIPT_SMTP_PASSWORD_FILE: /run/secrets/receipt_smtp_password
      RECEIPT_SMTP_TLS_SERVERNAME: ${RECEIPT_SMTP_TLS_SERVERNAME:-}
      RECEIPT_EMAIL_FROM_ADDRESS: ${RECEIPT_EMAIL_FROM_ADDRESS:-}
      RECEIPT_EMAIL_FROM_NAME: ${RECEIPT_EMAIL_FROM_NAME:-MyFin Receipts}
    secrets: [db_password, receipt_smtp_password]
    # `smtp-egress` must be pre-created with an infrastructure firewall that
    # permits only the reviewed SMTP submission destination and DNS/NTP needed
    # for that route. The API and other workers are never attached to it.
    networks: [nexus-data, smtp-egress]
    mem_limit: ${MYFIN_RECEIPT_EMAIL_MEMORY:-192m}
    cpus: ${MYFIN_RECEIPT_EMAIL_CPUS:-0.35}
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
networks:
  ingress:
    driver: bridge
  app:
    internal: true
  nexus-data:
    external: true
    name: nexus-data
  smtp-egress:
    external: true
    name: ${MYFIN_SMTP_EGRESS_NETWORK:-myfin-smtp-egress}
volumes:
  uploads:
    external: true
    name: ${MYFIN_UPLOAD_VOLUME:?assign private pre-provisioned upload volume}
secrets:
  db_password:
    file: ${MYFIN_DB_PASSWORD_FILE:?set absolute runtime password file path}

  auth_secret:
    file: ${MYFIN_AUTH_SECRET_FILE:?set absolute auth secret file path}
  pos_code_secret:
    file: ${MYFIN_POS_CODE_SECRET_FILE:?set absolute POS code secret file path}
  pos_session_secret:
    file: ${MYFIN_POS_SESSION_SECRET_FILE:?set absolute POS session secret file path}
  voucher_hmac_secret:
    file: ${MYFIN_VOUCHER_HMAC_SECRET_FILE:?set absolute voucher HMAC secret file path}
  receipt_smtp_password:
    file: ${MYFIN_SMTP_PASSWORD_FILE:-./disabled-smtp-password}
