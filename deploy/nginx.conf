worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 6m;
    map $remote_addr $myfin_original_scheme {
        default $scheme;
        192.168.1.103 https; # reviewed tunnel controller only; ignore client headers
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }
        # Exact /api and its subtree never enter the SPA fallback.
        location = /api { default_type application/json; return 404 '{"error":"not_found"}'; }
        location ^~ /api/ {
            # Docker embedded DNS, re-resolved so API recreation is recoverable.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_origin http://api:8080;
            proxy_pass $api_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $myfin_original_scheme;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            add_header Cache-Control "no-store" always;
            error_page 413 =413 @api_too_large;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_intercept_errors off;
            error_page 502 503 504 =503 @api_unavailable;
        }
        location @api_too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 413 '{"error":"file_too_large"}';
        }
        location @api_unavailable {
            default_type application/json;
            return 503 '{"error":"api_unavailable"}';
        }
        location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
        location = /index.html { add_header Cache-Control 'no-cache'; }
        location = /sw.js { add_header Cache-Control 'no-cache'; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
